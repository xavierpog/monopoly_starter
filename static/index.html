<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Monopoly Online</title>
<link rel="stylesheet" href="/static/style.css">
<script>tailwind.config = { corePlugins: { preflight: false } }</script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<!-- ══ Écran de connexion ══ -->
<div id="join" class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-800 to-green-950">
  <div class="bg-white rounded-2xl shadow-2xl px-10 py-8 w-full max-w-sm flex flex-col gap-4">
    <div class="text-center mb-1">
      <div class="text-5xl mb-2">🎲</div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Monopoly Online</h1>
      <p class="text-sm text-gray-500 mt-1">Rejoignez ou créez une partie</p>
    </div>
    <input id="inp-name"
      class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent"
      placeholder="Votre prénom" />
    <input id="inp-room"
      class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent"
      placeholder="Code de la salle (ex: partie1)" />
    <button onclick="join()"
      class="w-full bg-green-700 hover:bg-green-800 active:bg-green-900 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm cursor-pointer border-0">
      Rejoindre / Créer
    </button>
  </div>
</div>

<!-- ══ Écran de jeu ══ -->
<div id="game">
  <div id="board"></div>

  <div id="panel" class="flex flex-col gap-3 w-[300px] flex-shrink-0">

    <!-- Joueurs -->
    <div id="players-box" class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
      <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Joueurs</h3>
      <div id="players"></div>
    </div>

    <!-- Actions -->
    <div id="controls" class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 flex flex-col gap-2">
      <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Actions</h3>

      <button id="btn-start" onclick="send('start')"
        class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
               bg-green-600 hover:bg-green-700 text-white border-0
               disabled:opacity-40 disabled:cursor-not-allowed">
        Démarrer la partie
      </button>

      <button id="btn-roll" onclick="send('roll')" disabled
        class="w-full py-2 px-3 rounded-lg text-sm font-semibold transition-colors cursor-pointer
               bg-green-600 hover:bg-green-700 text-white border-0
               disabled:opacity-40 disabled:cursor-not-allowed">
        🎲 Lancer les dés
      </button>

      <button id="btn-buy" onclick="send('buy')" disabled
        class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
               bg-white hover:bg-gray-50 text-gray-700 border border-gray-300
               disabled:opacity-40 disabled:cursor-not-allowed">
        🏠 Acheter la propriété
      </button>

      <button id="btn-skip" onclick="send('auction')" disabled
        class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
               bg-white hover:bg-gray-50 text-gray-700 border border-gray-300
               disabled:opacity-40 disabled:cursor-not-allowed">
        🔨 Enchère
      </button>

      <button id="btn-trade" onclick="openTrade()" disabled
        class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
               bg-white hover:bg-gray-50 text-gray-700 border border-gray-300
               disabled:opacity-40 disabled:cursor-not-allowed">
        🤝 Proposer un échange
      </button>

      <!-- Section prison (JS gère display via style inline) -->
      <div id="jail-section" style="display:none"
        class="flex-col gap-2 pt-3 mt-1 border-t border-gray-100">
        <p class="text-xs text-gray-400 italic">🚔 Vous êtes en prison :</p>
        <button id="btn-goojf" onclick="send('use_goojf')" disabled
          class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
                 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200
                 disabled:opacity-40 disabled:cursor-not-allowed">
          🎫 Utiliser ma carte Sortie de Prison
        </button>
        <button id="btn-payjail" onclick="send('pay_jail')" disabled
          class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
                 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200
                 disabled:opacity-40 disabled:cursor-not-allowed">
          💰 Payer 50$ et finir mon tour
        </button>
      </div>

      <button id="btn-build" onclick="openBuild()" disabled
        class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
               bg-white hover:bg-gray-50 text-gray-700 border border-gray-300
               disabled:opacity-40 disabled:cursor-not-allowed">
        🏗️ Construire / Vendre
      </button>

      <button id="btn-inventory" onclick="openInventory()"
        class="w-full py-2 px-3 rounded-lg text-sm font-medium transition-colors cursor-pointer
               bg-white hover:bg-gray-50 text-gray-700 border border-gray-300">
        📋 Mes propriétés / Hypothèques
      </button>
    </div>

    <!-- Enchère (JS ajoute .open) -->
    <div id="auction-panel" class="bg-amber-50 border border-amber-200 rounded-xl shadow-sm p-4 text-sm">
      <h4 class="font-semibold text-amber-900 mb-1">🔨 Enchère : <span id="auction-prop"></span></h4>
      <p class="text-xs text-gray-500">Temps : <span id="auction-timer" class="font-bold text-red-600">60</span>s</p>
      <div id="auction-waiting" class="text-gray-400 italic text-xs mt-2"></div>
      <div id="auction-bid-row" class="flex gap-2 mt-3 items-center">
        <input type="number" id="auction-amount" min="0" placeholder="Mise ($)"
          class="flex-1 px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-amber-400" />
        <button onclick="submitBid()"
          class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg border-0 cursor-pointer transition-colors">
          Miser
        </button>
        <button onclick="submitBid(0)"
          class="px-3 py-1.5 bg-white hover:bg-gray-50 text-gray-600 text-xs font-medium rounded-lg border border-gray-300 cursor-pointer transition-colors">
          Passer
        </button>
      </div>
      <div id="auction-submitted" class="text-green-700 font-semibold mt-2 text-xs"></div>
    </div>

    <!-- Échange entrant (JS ajoute .open) -->
    <div id="trade-incoming" class="bg-yellow-50 border border-yellow-200 rounded-xl shadow-sm p-4">
      <h4 class="font-semibold text-yellow-900 mb-2 text-sm">🤝 Échange proposé</h4>
      <div id="ti-details" class="text-xs text-gray-600 leading-relaxed mb-3"></div>
      <div class="flex gap-2">
        <button onclick="send('trade_accept')"
          class="flex-1 py-1.5 bg-green-600 hover:bg-green-700 text-white text-xs font-semibold rounded-lg border-0 cursor-pointer transition-colors">
          Accepter
        </button>
        <button onclick="send('trade_reject')"
          class="flex-1 py-1.5 bg-white hover:bg-gray-50 text-gray-600 text-xs font-medium rounded-lg border border-gray-300 cursor-pointer transition-colors">
          Refuser
        </button>
      </div>
    </div>

    <!-- Journal & chat -->
    <div id="log-box" class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
      <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Journal</h3>
      <div id="log" class="text-xs text-gray-600 max-h-52 overflow-y-auto leading-relaxed space-y-0.5 mb-3"></div>
      <div id="chat-row" class="flex gap-2">
        <input id="chat-in" placeholder="Message..."
          onkeydown="if(event.key==='Enter')chat()"
          class="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-green-500" />
        <button onclick="chat()"
          class="px-3 py-1.5 bg-green-700 hover:bg-green-800 text-white text-xs font-medium rounded-lg border-0 cursor-pointer transition-colors">
          Envoyer
        </button>
      </div>
    </div>

  </div>
</div>

<!-- ══ Overlay victoire ══ -->
<div id="win-overlay">
  <div id="win-box" class="bg-white rounded-2xl shadow-2xl p-10 text-center max-w-sm w-full mx-4">
    <div class="text-5xl mb-4">🏆</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Partie terminée !</h1>
    <p id="win-msg" class="text-gray-500 mb-6 text-sm"></p>
    <button onclick="document.getElementById('win-overlay').classList.remove('open')"
      class="px-6 py-2.5 bg-green-700 hover:bg-green-800 text-white font-semibold rounded-xl border-0 cursor-pointer transition-colors">
      Fermer
    </button>
  </div>
</div>

<!-- ══ Modal taxe ══ -->
<div id="tax-overlay">
  <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center">
    <div class="text-3xl mb-3">💸</div>
    <h2 class="text-lg font-bold text-gray-900 mb-2">Taxe sur le revenu</h2>
    <div id="tax-info" class="text-sm text-gray-500 mb-6"></div>
    <div class="flex gap-3">
      <button onclick="send('tax_flat')"
        class="flex-1 py-3 bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 font-semibold rounded-xl cursor-pointer transition-colors text-sm">
        Payer 200$ fixe
      </button>
      <button onclick="send('tax_pct')"
        class="flex-1 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl border-0 cursor-pointer transition-colors text-sm">
        Payer <span id="tax-pct-amount"></span> (10%)
      </button>
    </div>
  </div>
</div>

<!-- ══ Modal inventaire ══ -->
<div id="inventory-overlay">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-lg mx-4"
       style="max-height:85vh; overflow-y:auto;">
    <h2 class="text-base font-bold text-gray-900 mb-4 pb-3 border-b border-gray-100">📋 Mes propriétés</h2>
    <div id="inventory-content"></div>
    <button onclick="document.getElementById('inventory-overlay').classList.remove('open')"
      class="mt-4 px-4 py-2 bg-white hover:bg-gray-50 border border-gray-300 text-gray-600 text-sm font-medium rounded-lg cursor-pointer transition-colors">
      Fermer
    </button>
  </div>
</div>

<!-- ══ Modal construction ══ -->
<div id="build-overlay">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md mx-4"
       style="max-height:85vh; overflow-y:auto;">
    <h2 class="text-base font-bold text-gray-900 mb-4 pb-3 border-b border-gray-100">🏗️ Construire / Vendre</h2>
    <div id="build-groups"></div>
    <button onclick="closeBuild()"
      class="mt-4 px-4 py-2 bg-white hover:bg-gray-50 border border-gray-300 text-gray-600 text-sm font-medium rounded-lg cursor-pointer transition-colors">
      Fermer
    </button>
  </div>
</div>

<!-- ══ Modal échange ══ -->
<div id="trade-overlay">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-xl mx-4"
       style="max-height:90vh; overflow-y:auto;">
    <h2 class="text-base font-bold text-gray-900 mb-4 pb-3 border-b border-gray-100">🤝 Proposer un échange</h2>

    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Proposer à</label>
      <select id="trade-target"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <h3 class="text-sm font-semibold text-gray-700 mb-3">J'offre</h3>
        <label class="block text-xs text-gray-500 mb-1">Argent ($)</label>
        <input type="number" id="trade-offer-money" min="0" value="0"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-green-500" />
        <label class="block text-xs text-gray-500 mb-1">Propriétés</label>
        <div id="trade-offer-props"
          class="border border-gray-200 rounded-lg p-2 max-h-36 overflow-y-auto text-xs space-y-1 bg-gray-50"></div>
        <label class="flex items-center gap-2 mt-2 text-xs text-gray-600 cursor-pointer">
          <input type="checkbox" id="trade-offer-goojf"> 🎫 Carte Sortie de Prison
        </label>
      </div>
      <div>
        <h3 class="text-sm font-semibold text-gray-700 mb-3">Je demande</h3>
        <label class="block text-xs text-gray-500 mb-1">Argent ($)</label>
        <input type="number" id="trade-req-money" min="0" value="0"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-green-500" />
        <label class="block text-xs text-gray-500 mb-1">Propriétés</label>
        <div id="trade-req-props"
          class="border border-gray-200 rounded-lg p-2 max-h-36 overflow-y-auto text-xs space-y-1 bg-gray-50"></div>
        <label class="flex items-center gap-2 mt-2 text-xs text-gray-600 cursor-pointer">
          <input type="checkbox" id="trade-req-goojf"> 🎫 Carte Sortie de Prison
        </label>
      </div>
    </div>

    <div class="flex gap-3 mt-5 justify-end">
      <button onclick="closeTrade()"
        class="px-4 py-2 bg-white hover:bg-gray-50 border border-gray-300 text-gray-600 text-sm font-medium rounded-lg cursor-pointer transition-colors">
        Annuler
      </button>
      <button onclick="submitTrade()"
        class="px-4 py-2 bg-green-700 hover:bg-green-800 text-white text-sm font-semibold rounded-lg border-0 cursor-pointer transition-colors">
        Envoyer l'offre
      </button>
    </div>
  </div>
</div>

<script src="/static/game.js"></script>
</body>
</html>
