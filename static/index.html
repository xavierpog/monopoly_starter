<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Monopoly Online</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false } }</script>
</head>
<body>

<!-- ══ Écran de connexion ══ -->
<div id="join" class="flex items-center justify-center min-h-screen" style="background:#12151E">
  <div class="ui-card w-full max-w-[340px] mx-4">
    <div class="p-8 flex flex-col gap-5">
      <div class="text-center">
        <div class="mb-4"><img src="/static/icons/dice-logo.svg" width="56" height="56"></div>
        <h1 class="font-bold tracking-[0.18em] uppercase" style="color:#F0EBE0;font-size:1.1rem">Monopoly Online</h1>
        <p class="mt-1.5 tracking-widest uppercase" style="font-size:10px;color:#8B93A7">Rejoignez ou créez une partie</p>
      </div>
      <div class="flex flex-col gap-3">
        <input id="inp-name" class="ui-input" placeholder="Votre prénom" />
        <input id="inp-room" class="ui-input" placeholder="Code de la salle (ex: partie1)" />
        <button onclick="join()" class="btn btn-primary tracking-wider uppercase text-sm" style="padding:11px">
          Rejoindre / Créer
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ══ Écran de jeu ══ -->
<div id="game">
  <div id="board"></div>

  <div id="panel" class="flex flex-col gap-3" style="width:300px;flex-shrink:0">

    <!-- Joueurs -->
    <div class="ui-card">
      <div class="ui-card-header">
        <span class="ui-label">Joueurs</span>
      </div>
      <div class="p-4">
        <div id="players"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="ui-card">
      <div class="ui-card-header">
        <span class="ui-label">Actions</span>
      </div>
      <div class="p-4 flex flex-col gap-2">
        <button id="btn-start" onclick="send('start')" class="btn btn-primary" style="display:flex;align-items:center;gap:8px;justify-content:center">
          <img src="/static/icons/play.svg" width="16" height="16"> Démarrer la partie
        </button>
        <button id="btn-roll" onclick="send('roll')" disabled class="btn btn-primary" style="display:flex;align-items:center;gap:8px;justify-content:center">
          <img src="/static/icons/dice.svg" width="16" height="16"> Lancer les dés
        </button>
        <button id="btn-buy" onclick="send('buy')" disabled class="btn btn-secondary" style="display:flex;align-items:center;gap:8px">
          <img src="/static/icons/house.svg" width="16" height="16"> Acheter la propriété
        </button>
        <button id="btn-skip" onclick="send('auction')" disabled class="btn btn-secondary" style="display:flex;align-items:center;gap:8px">
          <img src="/static/icons/hammer.svg" width="16" height="16"> Enchère
        </button>
        <button id="btn-trade" onclick="openTrade()" disabled class="btn btn-secondary" style="display:flex;align-items:center;gap:8px">
          <img src="/static/icons/trade.svg" width="16" height="16"> Proposer un échange
        </button>

        <!-- Section prison -->
        <div id="jail-section" style="display:none"
          class="flex-col gap-2 pt-3 mt-1" style="border-top:1px solid #2E374F">
          <p class="text-xs italic" style="color:#8B93A7;display:flex;align-items:center;gap:6px"><img src="/static/icons/lock.svg" width="12" height="12"> Vous êtes en prison :</p>
          <button id="btn-goojf" onclick="send('use_goojf')" disabled class="btn btn-amber" style="display:flex;align-items:center;gap:8px">
            <img src="/static/icons/ticket.svg" width="16" height="16"> Utiliser ma carte Sortie de Prison
          </button>
          <button id="btn-payjail" onclick="send('pay_jail')" disabled class="btn btn-danger" style="display:flex;align-items:center;gap:8px">
            <img src="/static/icons/coin.svg" width="16" height="16"> Payer 50$ et finir mon tour
          </button>
        </div>

        <button id="btn-build" onclick="openBuild()" disabled class="btn btn-secondary" style="display:flex;align-items:center;gap:8px">
          <img src="/static/icons/build.svg" width="16" height="16"> Construire / Vendre
        </button>
        <button id="btn-inventory" onclick="openInventory()" class="btn btn-muted" style="display:flex;align-items:center;gap:8px">
          <img src="/static/icons/list.svg" width="16" height="16"> Mes propriétés / Hypothèques
        </button>
      </div>
    </div>

    <!-- Enchère (JS ajoute .open) -->
    <div id="auction-panel" class="ui-card ui-card-amber">
      <div class="ui-card-header">
        <span class="ui-label" style="color:#E8A03A;display:flex;align-items:center;gap:6px"><img src="/static/icons/hammer.svg" width="12" height="12"> Enchère : <span id="auction-prop"></span></span>
      </div>
      <div class="p-4 text-sm">
        <p class="text-xs mb-2" style="color:#8B93A7">
          Temps : <span id="auction-timer" class="font-bold" style="color:#E05555">60</span>s
        </p>
        <div id="auction-waiting" class="text-xs italic mb-2" style="color:#8B93A7"></div>
        <div id="auction-bid-row" class="flex gap-2 items-center">
          <input type="number" id="auction-amount" min="0" placeholder="Mise ($)"
            class="ui-input flex-1" style="padding:6px 10px;font-size:0.75rem" />
          <button onclick="submitBid()"
            class="btn btn-primary" style="width:auto;padding:6px 12px;font-size:0.75rem">
            Miser
          </button>
          <button onclick="submitBid(0)"
            class="btn btn-secondary" style="width:auto;padding:6px 10px;font-size:0.75rem">
            Passer
          </button>
        </div>
        <div id="auction-submitted" class="font-semibold mt-2 text-xs" style="color:#4ECB71"></div>
      </div>
    </div>

    <!-- Échange entrant (JS ajoute .open) -->
    <div id="trade-incoming" class="ui-card">
      <div class="ui-card-header">
        <span class="ui-label">🤝 Échange proposé</span>
      </div>
      <div class="p-4">
        <div id="ti-details" class="text-xs leading-relaxed mb-3" style="color:#A8B0C2"></div>
        <div class="flex gap-2">
          <button onclick="send('trade_accept')" class="btn btn-confirm" style="flex:1;padding:7px;font-size:0.75rem">
            Accepter
          </button>
          <button onclick="send('trade_reject')" class="btn btn-secondary" style="flex:1;padding:7px;font-size:0.75rem;text-align:center">
            Refuser
          </button>
        </div>
      </div>
    </div>

    <!-- Journal & chat -->
    <div class="ui-card">
      <div class="ui-card-header">
        <span class="ui-label">Journal</span>
      </div>
      <div class="p-4">
        <div id="log" class="text-xs leading-relaxed mb-3" style="color:#A8B0C2;max-height:208px;overflow-y:auto"></div>
        <div id="chat-row" class="flex gap-2">
          <input id="chat-in" placeholder="Message..."
            onkeydown="if(event.key==='Enter')chat()"
            class="ui-input flex-1" style="padding:7px 12px;font-size:0.75rem" />
          <button onclick="chat()"
            class="btn btn-primary" style="width:auto;padding:7px 14px;font-size:0.75rem">
            →
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ══ Overlay victoire ══ -->
<div id="win-overlay">
  <div id="win-box" class="rounded-2xl p-10 text-center mx-4" style="background:#1C2133;border:1px solid #2E374F;border-top:3px solid #E8B84B;max-width:380px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,0.7)">
    <div class="mb-4"><img src="/static/icons/trophy.svg" width="56" height="56"></div>
    <h1 class="text-xl font-bold mb-2 tracking-wider uppercase" style="color:#E8B84B">Partie terminée !</h1>
    <p id="win-msg" class="text-sm mb-6" style="color:#A8B0C2"></p>
    <button onclick="document.getElementById('win-overlay').classList.remove('open')"
      class="btn btn-primary" style="width:auto;padding:10px 28px">
      Fermer
    </button>
  </div>
</div>

<!-- ══ Modal taxe ══ -->
<div id="tax-overlay">
  <div class="rounded-2xl mx-4 text-center" style="background:#1C2133;border:1px solid #2E374F;border-top:3px solid #E8B84B;padding:32px;max-width:380px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,0.7)">
    <div class="mb-3"><img src="/static/icons/dollar.svg" width="40" height="40"></div>
    <h2 class="text-base font-bold mb-2" style="color:#F0EBE0">Taxe sur le revenu</h2>
    <div id="tax-info" class="text-sm mb-6" style="color:#A8B0C2"></div>
    <div class="flex gap-3">
      <button onclick="send('tax_flat')"
        class="btn btn-secondary" style="flex:1;padding:12px;text-align:center;font-weight:600">
        Payer 200$ fixe
      </button>
      <button onclick="send('tax_pct')"
        class="btn btn-primary" style="flex:1;padding:12px;font-weight:600">
        Payer <span id="tax-pct-amount"></span> (10%)
      </button>
    </div>
  </div>
</div>

<!-- ══ Modal inventaire ══ -->
<div id="inventory-overlay">
  <div class="rounded-2xl mx-4" style="background:#1C2133;border:1px solid #2E374F;border-top:3px solid #E8B84B;padding:24px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.7)">
    <div class="flex items-center justify-between pb-3 mb-4" style="border-bottom:1px solid #2E374F">
      <h2 class="font-bold" style="color:#F0EBE0;font-size:0.9rem;display:flex;align-items:center;gap:6px"><img src="/static/icons/list.svg" width="14" height="14"> Mes propriétés</h2>
    </div>
    <div id="inventory-content"></div>
    <button onclick="document.getElementById('inventory-overlay').classList.remove('open')"
      class="btn btn-muted mt-4" style="width:auto;padding:7px 18px">
      Fermer
    </button>
  </div>
</div>

<!-- ══ Modal construction ══ -->
<div id="build-overlay">
  <div class="rounded-2xl mx-4" style="background:#1C2133;border:1px solid #2E374F;border-top:3px solid #E8B84B;padding:24px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.7)">
    <div class="flex items-center justify-between pb-3 mb-4" style="border-bottom:1px solid #2E374F">
      <h2 class="font-bold" style="color:#F0EBE0;font-size:0.9rem;display:flex;align-items:center;gap:6px"><img src="/static/icons/build.svg" width="14" height="14"> Construire / Vendre</h2>
    </div>
    <div id="build-groups"></div>
    <button onclick="closeBuild()"
      class="btn btn-muted mt-4" style="width:auto;padding:7px 18px">
      Fermer
    </button>
  </div>
</div>

<!-- ══ Modal échange ══ -->
<div id="trade-overlay">
  <div class="rounded-2xl mx-4" style="background:#1C2133;border:1px solid #2E374F;border-top:3px solid #E8B84B;padding:24px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.7)">
    <div class="pb-3 mb-4" style="border-bottom:1px solid #2E374F">
      <h2 class="font-bold" style="color:#F0EBE0;font-size:0.9rem">🤝 Proposer un échange</h2>
    </div>

    <div class="mb-4">
      <label class="ui-label block mb-2">Proposer à</label>
      <select id="trade-target" class="ui-input">
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <h3 class="text-sm font-semibold mb-3" style="color:#F0EBE0">J'offre</h3>
        <label class="block text-xs mb-1" style="color:#8B93A7">Argent ($)</label>
        <input type="number" id="trade-offer-money" min="0" value="0" class="ui-input mb-3" />
        <label class="block text-xs mb-1" style="color:#8B93A7">Propriétés</label>
        <div id="trade-offer-props"
          class="rounded-lg p-2 text-xs space-y-1" style="border:1px solid #2E374F;background:#12151E;max-height:160px;overflow-y:auto;color:#A8B0C2"></div>
      </div>
      <div>
        <h3 class="text-sm font-semibold mb-3" style="color:#F0EBE0">Je demande</h3>
        <label class="block text-xs mb-1" style="color:#8B93A7">Argent ($)</label>
        <input type="number" id="trade-req-money" min="0" value="0" class="ui-input mb-3" />
        <label class="block text-xs mb-1" style="color:#8B93A7">Propriétés</label>
        <div id="trade-req-props"
          class="rounded-lg p-2 text-xs space-y-1" style="border:1px solid #2E374F;background:#12151E;max-height:160px;overflow-y:auto;color:#A8B0C2"></div>
      </div>
    </div>

    <div class="flex gap-3 mt-5 justify-end">
      <button onclick="closeTrade()"
        class="btn btn-muted" style="width:auto;padding:8px 18px">
        Annuler
      </button>
      <button onclick="submitTrade()"
        class="btn btn-primary" style="width:auto;padding:8px 20px">
        Envoyer l'offre
      </button>
    </div>
  </div>
</div>

<script src="/static/game.js?v=3"></script>
</body>
</html>
